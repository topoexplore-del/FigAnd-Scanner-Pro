name: Full Refresh + Backtest (Daily)

on:
  schedule:
    # Lun-Vie 21:30 UTC ≈ 16:30 ET en invierno (EST) / 17:30 ET en verano (EDT).
    # En ambos casos es después del cierre (16:00 ET), que es lo que importa.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Full data refresh + backtest
        run: python scripts/build_data.py --out-dir data
        env:
          TZ: America/New_York
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}

      - name: Check alerts (con datos frescos del cierre)
        run: python scripts/check_alerts.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Escaneo FIGAND del universo completo (Listado)
        run: python scripts/figand_scan.py
        env:
          FIGAND_BUDGET_MIN: '25'
          FIGAND_INCLUDE_ETF: '1'

      - name: Recalcular perfiles FIGAND
        run: python scripts/figand_stats.py

      - name: Seguimiento de alertas (historial con resultados)
        run: python scripts/track_alerts.py

      - name: Guard de tamaño (límite GitHub 100MB)
        run: |
          FAIL=0
          for f in data/*.json; do
            [ -f "$f" ] || continue
            SZ=$(stat -c%s "$f")
            MB=$((SZ / 1048576))
            echo "$f → ${MB}MB"
            if [ "$SZ" -gt 94371840 ]; then
              echo "::error::$f pesa ${MB}MB — supera el margen seguro (90MB) del límite de GitHub (100MB). No se commitea."
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "chore: daily refresh + backtest [automated]" && git push)
